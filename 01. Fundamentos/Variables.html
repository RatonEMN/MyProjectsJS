  <body>
    <h1>Varibles</h1>

    <script>

      //Solo existen 2 formas principales para declarar variables

            var name = "placido";
            let nombre = "Placido Domingues";
            //console.log(name);

            //Ambito de bloque

            console.log("****************var***********");

            console.log("Variable música antes del bloque: ",musica);
            {
                var musica = "pop";
                console.log("Variable musica dentro del bloque",musica);

            console.log("Variable música antes del bloque: ",musica);

            console.log("****************let***********");

            console.log("Variable música antes del bloque: ",musica2);
            {
                let musica2= "pop";
                console.log("Variable musica dentro del bloque",musica2);
            }
            
            console.log("Variable música antes del bloque: ",musica2);
     
      let a;
